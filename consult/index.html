<title>공부의 신 수학 · 입학 상담 신청</title>
<style>html,body{margin:0;height:100%;background:#F5F6F9}iframe{border:0;width:100%;height:100vh;height:100dvh;display:block}
@media (prefers-color-scheme:dark){html,body{background:#0E1626}}</style>
</head>
<body>
<script>
  // ↓ 배포 후 받은 웹 앱 주소(…/exec)로 바꾸세요
  var GAS = 'https://script.google.com/macros/s/AKfycbwhqAmvfEP6mCQ5hHHtxRc05xkN5Ei2R_PNNtNneiQ1GVlSysKIWZH8rb1cLy3wxOM/exec';
  var q = new URLSearchParams(location.search);
  q.set('page', 'consult');
  var f = document.createElement('iframe');
  f.src = GAS + '?' + q.toString();
  f.title = '입학 상담 신청';
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
</script>
</body>
